<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Michael!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --barca-blue: #004d98;
      --barca-red: #a50044;
      --gold: #ffed00;
      --dark-blue: #0a192f;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--barca-blue) 0%, var(--dark-blue) 50%, var(--barca-red) 100%);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 25px;
      max-width: 550px;
      width: 92%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      position: relative;
    }

    .badge {
      background-color: var(--gold);
      color: var(--barca-blue);
      font-size: 1.1rem;
      font-weight: 800;
      padding: 8px 20px;
      border-radius: 50px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 2.3rem;
      margin: 12px 0 5px;
      color: #ffffff;
      text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.8);
    }

    /* Pitch Container */
    .pitch {
      position: relative;
      background: linear-gradient(0deg, #1e7e34 0%, #28a745 100%);
      border: 3px solid white;
      border-radius: 16px;
      height: 230px;
      margin: 20px 0;
      overflow: hidden;
    }

    /* Player Avatar Styling */
    .player {
      position: absolute;
      bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
      transition: transform 0.2s ease;
      z-index: 2;
    }

    .player-lamine {
      left: 10px;
    }

    .player-miko {
      left: 210px;
    }

    .avatar-head {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
      background-color: white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    .avatar-body {
      width: 42px;
      height: 48px;
      background: linear-gradient(90deg, var(--barca-blue) 50%, var(--barca-red) 50%);
      border-radius: 6px 6px 0 0;
      margin-top: -6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--gold);
      border: 1px solid rgba(255,255,255,0.3);
      text-shadow: 1px 1px 2px black;
    }

    .player-tag {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--gold);
      margin-top: 3px;
      white-space: nowrap;
    }

    /* Kicking Animation */
    .kick-action {
      transform: scale(1.15) translateY(-5px);
    }

    /* Goal Net */
    .goal-net {
      position: absolute;
      right: 5px;
      bottom: 15px;
      width: 55px;
      height: 110px;
      border: 3px solid white;
      border-left: none;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.2), rgba(255,255,255,0.2) 5px, transparent 5px, transparent 10px);
    }

    /* Football */
    .ball {
      font-size: 2.2rem;
      position: absolute;
      left: 80px;
      bottom: 20px;
      cursor: pointer;
      user-select: none;
      transition: all 0.6s ease-in-out;
      z-index: 3;
    }

    /* Ball Trajectory Classes */
    .ball-pass {
      left: 200px !important;
      bottom: 20px !important;
      transform: rotate(360deg);
    }

    .ball-score {
      left: 450px !important;
      bottom: 60px !important;
      transform: rotate(1080deg) scale(0.7);
    }

    /* Goal Banner */
    .goal-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 4px 4px var(--barca-red), -2px -2px 0 #000;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 10;
      width: 100%;
    }

    .goal-banner.show {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    button {
      background: linear-gradient(45deg, #ffed00, #ffaa00);
      color: #000;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255, 237, 0, 0.4);
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-voice {
      background: linear-gradient(45deg, var(--barca-red), #e6005c);
      color: white;
      box-shadow: 0 4px 15px rgba(165, 0, 68, 0.4);
    }

    .scoreboard {
      margin-top: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      background: rgba(0,0,0,0.4);
      padding: 8px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <audio id="birthdayVoice" src="Miko.mp3" preload="auto"></audio>

  <div class="card">
    <div class="badge">FC Barcelona Dream Team ⚽</div>
    <h1>HAPPY BIRTHDAY MICHAEL!</h1>

    <div class="pitch">
      <!-- Lamine Yamal Player -->
      <div id="lamine" class="player player-lamine">
        <img class="avatar-head" src="https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcTs-PAGEQmLyioAwLBlYaD9YfUhFilcDdKqLW1w3b_lD0aSzRQQtOQHO_jh9EE3rtc9F4EezPCYAaWrP34" alt="Lamine Yamal">
        <div class="avatar-body">19</div>
        <div class="player-tag">Lamine Yamal</div>
      </div>

      <!-- Michael (Miko) Player -->
      <div id="miko" class="player player-miko">
        <img class="avatar-head" src="Michael.png" alt="Michael Head">
        <div class="avatar-body">7</div>
        <div class="player-tag">Michael Fakhry</div>
      </div>

      <div id="ball" class="ball" onclick="playAssistAndGoal()">⚽</div>
      <div class="goal-net"></div>
      <div id="goalBanner" class="goal-banner">GOAL BY MICHAEL! 🎉</div>
    </div>

    <div class="btn-group">
      <button onclick="playAssistAndGoal()">⚽ SCORE A GOAL!</button>
      <button class="btn-voice" onclick="playVoice()">🗣️ LISTEN TO MESSAGE</button>
    </div>

    <div class="scoreboard">
      Michael's Goals Scored: <span id="goalCount" style="color: var(--gold);">0</span>
    </div>
  </div>

  <script>
    let goals = 0;
    let isPlaying = false;

    window.onload = function() {
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    };

    function playAssistAndGoal() {
      if (isPlaying) return;
      isPlaying = true;

      const ball = document.getElementById('ball');
      const lamine = document.getElementById('lamine');
      const miko = document.getElementById('miko');
      const banner = document.getElementById('goalBanner');

      // Step 1: Lamine Yamal passes to Michael
      lamine.classList.add('kick-action');
      ball.classList.add('ball-pass');

      // Step 2: Ball arrives at Michael, Michael shoots into the net
      setTimeout(() => {
        lamine.classList.remove('kick-action');
        miko.classList.add('kick-action');
        ball.classList.remove('ball-pass');
        ball.classList.add('ball-score');
      }, 650);

      // Step 3: Goal scored celebration
      setTimeout(() => {
        miko.classList.remove('kick-action');
        goals++;
        document.getElementById('goalCount').innerText = goals;
        banner.classList.add('show');

        confetti({
          particleCount: 80,
          spread: 70,
          origin: { x: 0.85, y: 0.5 },
          colors: ['#004d98', '#a50044', '#ffed00']
        });
      }, 1200);

      // Step 4: Reset pitch position for next try
      setTimeout(() => {
        banner.classList.remove('show');
        ball.classList.remove('ball-score');
        isPlaying = false;
      }, 2600);
    }

    function playVoice() {
  const audio = document.getElementById('birthdayVoice');
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(function(e) {
      alert("Please tap the screen first, then try the voice button again!");
    });
  }
}
  </script>

</body>
</html>
